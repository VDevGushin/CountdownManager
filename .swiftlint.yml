included:
  - Sources
  - Tests
  - XCUITests

allow_zero_lintable_files: false
strict: true
reporter: xcode

# Keep this list explicit. These rules catch correctness and local readability
# problems without turning existing file size or formatting debt into noise.
only_rules:
  - accessibility_label_for_image
  - accessibility_trait_for_button
  - array_init
  - async_without_await
  - balanced_xctest_lifecycle
  - blanket_disable_command
  - closing_brace
  - colon
  - comma
  - compiler_protocol_init
  - contains_over_filter_count
  - contains_over_filter_is_empty
  - control_statement
  - custom_rules
  - discarded_notification_center_observer
  - discouraged_none_name
  - duplicate_conditions
  - duplicate_enum_cases
  - duplicate_imports
  - duplicated_key_in_dictionary_literal
  - empty_collection_literal
  - empty_count
  - empty_enum_arguments
  - empty_parameters
  - empty_parentheses_with_trailing_closure
  - empty_string
  - empty_xctest_method
  - fallthrough
  - fatal_error_message
  - first_where
  - flatmap_over_map_reduce
  - force_cast
  - identical_operands
  - implicit_getter
  - joined_default_parameter
  - last_where
  - leading_whitespace
  - legacy_cggeometry_functions
  - legacy_constant
  - legacy_constructor
  - legacy_hashing
  - legacy_multiple
  - legacy_nsgeometry_functions
  - mark
  - no_fallthrough_only
  - notification_center_detachment
  - opening_brace
  - function_name_whitespace
  - orphaned_doc_comment
  - overridden_super_call
  - prefer_zero_over_explicit_init
  - private_over_fileprivate
  - prohibited_super_call
  - reduce_boolean
  - reduce_into
  - redundant_discardable_let
  - redundant_nil_coalescing
  - redundant_objc_attribute
  - implicit_optional_initialization
  - invalid_swiftlint_command
  - redundant_set_access_control
  - redundant_string_enum_value
  - redundant_void_return
  - return_arrow_whitespace
  - return_value_from_void_function
  - self_in_property_initialization
  - sorted_first_last
  - static_operator
  - superfluous_disable_command
  - syntactic_sugar
  - toggle_bool
  - trailing_semicolon
  - trailing_whitespace
  - unneeded_break_in_switch
  - unneeded_parentheses_in_closure_argument
  - unavailable_condition
  - unhandled_throwing_task
  - unowned_variable_capture
  - unused_closure_parameter
  - unused_control_flow_label
  - unused_enumerated
  - unused_import
  - unused_optional_binding
  - unused_setter_value
  - valid_ibinspectable
  - vertical_parameter_alignment
  - void_return
  - void_function_in_ternary
  - weak_delegate
  - xctfail_message
  - yoda_condition

custom_rules:
  production_force_try:
    included: "Sources/.*\\.swift"
    regex: "\\btry!"
    message: "Handle production errors explicitly instead of using try!."
    severity: error
